[package]
name = "slint-rust-template"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0.154"
slint = "1.18.1"
surrealdb = { version = "4.0.0", features = ["kv-surrealkv"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
